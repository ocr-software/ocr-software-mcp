[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "ocr-software-mcp"
version = "0.3.1"
description = "MCP server for the ocr-software.com OCR API: quote, submit, poll, fetch text, Markdown, JSON, hOCR."
readme = {file = "INSTALL.txt", content-type = "text/markdown"}
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["mcp==1.30.0", "ocr-software==0.1.3"]
keywords = ["ocr", "mcp", "mcp-server", "pdf", "document-ai"]
classifiers = ["Programming Language :: Python :: 3"]

[project.optional-dependencies]
test = ["pytest==9.0.2"]

[project.urls]
Homepage = "https://ocr-software.com/integrations/mcp/"
Repository = "https://github.com/ocr-software/ocr-software-mcp"

[project.scripts]
ocr-software-mcp = "ocr_software_mcp.server:main"

[tool.setuptools]
packages = ["ocr_software_mcp"]
